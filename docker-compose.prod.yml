services:
  postgres:
    image: postgres:16-alpine
    container_name: luminatix_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-luminatix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luminatix_dev}
      POSTGRES_DB: ${DB_NAME:-luminatix}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luminatix} -d ${DB_NAME:-luminatix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luminatix_redis_prod
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminatix_backend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-luminatix}
      - DB_USER=${DB_USER:-luminatix}
      - DB_PASSWORD=${DB_PASSWORD:-luminatix_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      - SEAT_HOLD_TTL_SECONDS=600
      - WAITLIST_OFFER_TTL_SECONDS=900
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "src/index.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: luminatix_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local

networks:
  default:
    name: luminatix_prod_network
