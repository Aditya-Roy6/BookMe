services:
  postgres:
    image: postgres:16-alpine
    container_name: luminatix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luminatix
      POSTGRES_PASSWORD: luminatix_dev
      POSTGRES_DB: luminatix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminatix -d luminatix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luminatix_net

  redis:
    image: redis:7-alpine
    container_name: luminatix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luminatix_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminatix_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=luminatix
      - DB_USER=luminatix
      - DB_PASSWORD=luminatix_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminatix_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminatix_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - luminatix_net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  luminatix_net:
    driver: bridge
