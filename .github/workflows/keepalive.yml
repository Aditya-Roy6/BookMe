name: Keepalive Render Backend

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f -o /dev/null -w "Status: %{http_code} | Time: %{time_total}s\n" https://bookme-backend-edh7.onrender.com/api/health
